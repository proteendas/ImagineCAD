# cargo-about configuration: generates THIRD_PARTY_LICENSES.html for installers.
#   cargo about generate packaging/licenses/about.hbs -o dist/THIRD_PARTY_LICENSES.html
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "LicenseRef-UFL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "NCSA",
    "GPL-3.0",
    "GPL-3.0-only",
    "CDLA-Permissive-2.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
workarounds = ["ring", "rustls"]
